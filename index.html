<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Winamp Project Codex</title>

  <link rel="icon" href="data:,">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0c1123">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="page-shell">

    <section class="project-header">
      <div>
        <h1>Winamp Project Codex</h1>
        <p>Base 2.91 + músicas do projeto atual</p>
      </div>

      <div class="project-badge" id="track-count">
        Carregando...
      </div>
    </section>

    <section class="connection-banner is-online" id="connection-banner">
      <span id="connection-status-text">Online</span>
    </section>

    <section class="webamp-stage">
      <div id="webamp-container"></div>
    </section>

    <section class="project-footer">
      <p id="player-status">
        Inicializando Webamp...
      </p>

      <div class="offline-tools">
        <button type="button" id="cache-core-button" class="offline-button">
          Salvar básico offline
        </button>

        <span id="offline-cache-status" class="offline-cache-status">
          Cache preparado para músicas acessadas.
        </span>
      </div>

      <details class="offline-picker-panel">
        <summary>
          Escolher músicas offline
          <span id="offline-selected-count">0/10 selecionadas</span>
        </summary>

        <div class="offline-picker-tools">
          <button type="button" id="select-top-offline" class="ranking-button">
            Marcar top 10
          </button>

          <button type="button" id="clear-offline-selection" class="ranking-button">
            Limpar
          </button>

          <button type="button" id="cache-selected-button" class="ranking-button primary">
            Salvar selecionadas
          </button>
        </div>

        <div class="offline-picker-list" id="offline-picker-list">
          Carregando músicas...
        </div>
      </details>

      <details class="download-panel">
        <summary>
          Baixar músicas
          <span id="download-count">0 arquivos · 0 downloads</span>
        </summary>

        <div class="download-panel-tools">
          <span class="download-hint">
            Ordenado por mais baixadas
          </span>

          <button type="button" id="refresh-ranking" class="ranking-button">
            Atualizar
          </button>
        </div>

        <div class="download-list" id="download-list">
          Carregando lista...
        </div>
      </details>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/webamp@2.2.0/built/webamp.bundle.min.js"></script>
  <script type="module" src="./index.js"></script>
</body>
</html>
