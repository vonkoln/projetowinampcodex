<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Winamp Project Codex</title>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="page-shell">

    <section class="project-header">
      <div>
        <h1>Winamp Project Codex</h1>
        <p>Base 2.91 + músicas do projeto atual</p>
      </div>

      <div class="project-badge" id="track-count">
        Carregando...
      </div>
    </section>

    <section class="webamp-stage">
      <div id="webamp-container"></div>
    </section>

    <section class="project-footer">
      <p id="player-status">
        Inicializando Webamp...
      </p>

      <details class="download-panel">
        <summary>
          Baixar músicas
          <span id="download-count">0 arquivos</span>
        </summary>

        <div class="download-list" id="download-list">
          Carregando lista...
        </div>
      </details>

      <details class="ranking-panel" open>
        <summary>
          Ranking global de downloads
          <span id="ranking-total">0 downloads</span>
        </summary>

        <div class="ranking-list" id="ranking-list">
          Carregando ranking global...
        </div>

        <button type="button" id="refresh-ranking" class="ranking-button">
          Atualizar ranking
        </button>
      </details>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/webamp@2.2.0/built/webamp.bundle.min.js"></script>
  <script type="module" src="./index.js"></script>
</body>
</html>
