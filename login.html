<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Administração de Playlists</title>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./loginstyle.css">
</head>

<body>
  <main class="admin-shell">

    <section class="admin-header">
      <div>
        <h1>Administração de Playlists</h1>
        <p>Login dinâmico via Google Sheets + Apps Script.</p>
      </div>

      <a class="link-button secondary" href="./index.html">
        Voltar ao player
      </a>
    </section>

    <section class="admin-card" id="login-card">
      <h2>Login do administrador</h2>

      <form class="form-grid" id="login-form">
        <label for="admin-user">
          Usuário
          <input
            type="text"
            id="admin-user"
            name="admin-user"
            autocomplete="username"
            placeholder="admin"
            required
          >
        </label>

        <label for="admin-password">
          Senha
          <input
            type="password"
            id="admin-password"
            name="admin-password"
            autocomplete="current-password"
            placeholder="Digite a senha"
            required
          >
        </label>

        <button type="submit">
          Entrar
        </button>
      </form>

      <p class="status" id="login-status"></p>
    </section>

    <section class="admin-card hidden" id="admin-panel">
      <h2>Adicionar playlist do repositório vonkoln</h2>

      <form class="form-grid" id="playlist-form">

        <div class="repo-toolbar">
          <label for="repo-search">
            Buscar na lista
            <input
              type="search"
              id="repo-search"
              name="repo-search"
              placeholder="Digite parte do nome: raimundos, redhot..."
              autocomplete="off"
            >
          </label>

          <button type="button" class="secondary" id="refresh-repos">
            Atualizar lista
          </button>
        </div>

        <label for="repo-selector">
          Repositórios disponíveis
          <select id="repo-selector" name="repo-selector">
            <option value="">Carregando repositórios...</option>
          </select>
        </label>

        <div class="repo-preview" id="repo-preview">
          Selecione um repositório para verificar se ele contém data.js e pasta files.
        </div>

        <label for="playlist-name">
          Nome da playlist
          <input
            type="text"
            id="playlist-name"
            name="playlist-name"
            placeholder="Será preenchido pelo README, se possível"
          >
        </label>

        <label for="playlist-branch">
          Branch
          <input
            type="text"
            id="playlist-branch"
            name="playlist-branch"
            placeholder="main ou master"
          >
        </label>

        <div class="button-row">
          <button type="button" id="inspect-github">
            Verificar playlist
          </button>

          <button type="submit">
            Salvar playlist
          </button>

          <button type="button" class="secondary" id="logout-button">
            Sair
          </button>
        </div>
      </form>

      <p class="status" id="admin-status"></p>
    </section>

    <section class="admin-card hidden" id="playlist-manager">
      <h2>Playlists cadastradas</h2>

      <div class="playlist-list" id="playlist-list">
        Carregando playlists...
      </div>
    </section>

  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
